filebeat.inputs:
  - type: filestream
    id: identityops
    paths: [/logs/*.jsonl]
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "identityops-%{+yyyy.MM.dd}"
setup.ilm.enabled: false
setup.template.enabled: false
setup.template.name: identityops
setup.template.pattern: "identityops-*"
